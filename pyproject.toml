[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "mod_dict"
version = "0.8.22"
description = "Nested dictionary with indexed field queries, merge and serialization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["dictionary", "nested", "index", "merge", "serialization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/grey-pre-server/mod_dict"
Repository = "https://github.com/grey-pre-server/mod_dict"
Benchmarks = "https://github.com/grey-pre-server/mod_dict/blob/master/BENCHMARK.md"
"API Reference" = "https://github.com/grey-pre-server/mod_dict/blob/master/src/mod_dict.pyi"


[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = []
